<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Stiamo arrivando</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            background-color: #0a0a0a; /* nero tipo menu */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 20px;
        }

        .top-text {
            font-size: 13px;
            letter-spacing: 4px;
            opacity: 0.6;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 72px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .subtitle {
            margin-top: 25px;
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .btn {
            margin-top: 40px;
            display: inline-block;
            padding: 14px 28px;
            border: 1px solid #ffffff;
            text-decoration: none;
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #ffffff;
            color: #0a0a0a;
        }

        /* responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="top-text">STIAMO ARRIVANDO</div>

    <h1>
        QUALCOSA DI<br>
        GRANDE STA<br>
        PER NASCERE
    </h1>

    <div class="subtitle">
        PRESTO ONLINE. RESTA CONNESSO.
    </div>
</div>

</body>
</html>
