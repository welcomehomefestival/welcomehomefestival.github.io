<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Home Festival</title>

    <link rel="icon" href="images/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Urbanist:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            overflow-x:hidden;

            display:flex;
            align-items:center;
            justify-content:center;

            text-align:center;
            color:#fff;

            font-family:'Urbanist',sans-serif;

            position:relative;

            opacity:0;
            animation:pageFade 1.5s ease forwards;
        }

        /* FOTO DI SFONDO */

        body::before{
            content:"";
            position:absolute;
            inset:0;

            background:url("images/home-slider/1.webp")
            center center/cover no-repeat;

            filter:grayscale(100%);

            transform:scale(1.12);
            opacity:0;

            animation:bgReveal 2.5s ease forwards;
        }

        /* OVERLAY */

        body::after{
            content:"";
            position:absolute;
            inset:0;

            background:rgba(0,0,0,1);
        }

        .container{
            position:relative;
            z-index:2;

            width:100%;
            max-width:1100px;

            padding:clamp(20px,4vw,50px);
        }

        .logo{
            width:clamp(140px,18vw,240px);
            max-width:80%;

            margin-bottom:clamp(25px,4vw,50px);

            opacity:0;
            transform:translateY(30px);

            animation:
                    fadeUp 1.2s ease .4s forwards,
                    logoFloat 5s ease-in-out infinite 2s;
        }

        .small-title{
            letter-spacing:4px;
            text-transform:uppercase;

            font-size:clamp(11px,1.2vw,14px);

            opacity:.65;

            margin-bottom:20px;

            animation:fadeUp 1s ease .2s forwards;
            opacity:0;
        }

        h1{
            font-family:'Syne',sans-serif;

            font-size:clamp(34px,8vw,90px);

            font-weight:800;
            line-height:.95;

            text-transform:uppercase;

            margin-bottom:25px;

            animation:fadeUp 1s ease .4s forwards;
            opacity:0;
        }

        .description{
            max-width:700px;

            margin:auto;

            font-size:clamp(15px,2vw,20px);

            line-height:1.8;

            opacity:.8;

            animation:fadeUp 1s ease .6s forwards;
            opacity:0;
        }

        .social{
            margin-top:clamp(30px,5vw,60px);

            animation:fadeUp 1s ease .8s forwards;
            opacity:0;
        }

        .social a{
            display:inline-block;

            color:#fff;
            text-decoration:none;

            font-size:clamp(11px,1.2vw,13px);

            letter-spacing:2px;
            text-transform:uppercase;

            padding:14px 28px;

            border:1px solid rgba(255,255,255,.35);

            transition:.35s ease;
        }

        .social a:hover{
            background:#fff;
            color:#000;
        }

        @keyframes pageFade{
            from{
                opacity:0;
            }
            to{
                opacity:1;
            }
        }

        @keyframes bgReveal{
            from{
                opacity:0;
                transform:scale(1.18);
            }
            to{
                opacity:1;
                transform:scale(1.05);
            }
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @keyframes logoFloat{
            0%{
                transform:translateY(0);
            }
            50%{
                transform:translateY(-8px);
            }
            100%{
                transform:translateY(0);
            }
        }

        /* TABLET */

        @media (max-width: 992px){

            body{
                overflow-y:auto;
            }

            .container{
                padding:40px 30px;
            }
        }

        /* SMARTPHONE */

        @media (max-width: 576px){

            body::before{
                background-position:center center;
            }

            h1{
                line-height:1.05;
            }

            .description{
                line-height:1.7;
            }

            .social a{
                width:100%;
                max-width:280px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <img src="images/welcomehome_logo.png"
         alt="Welcome Home Festival"
         class="logo">

    <div class="small-title">
        Welcome Home Festival
    </div>

    <h1>
        L'EDIZIONE 2026<br>
        È TERMINATA
    </h1>

    <p class="description">
        Grazie agli artisti, ai visitatori, ai partner e a tutti coloro che
        hanno contribuito a rendere possibile questa edizione del festival.
        Ci rivedremo presto con nuovi progetti, nuove mostre e nuove storie.
    </p>

    <div class="social">
        <a href="https://www.instagram.com/welcomehomefestival/" target="_blank">
            Segui il Festival su Instagram
        </a>
    </div>

</div>

</body>
</html>
