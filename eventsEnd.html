<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Home Festival</title>

    <link rel="icon" href="images/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Urbanist:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            overflow:hidden;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:#fff;
            font-family:'Urbanist',sans-serif;
            position:relative;
        }

        /* FOTO DI SFONDO */
        body::before{
            content:"";
            position:absolute;
            inset:0;
            background:url("images/home-slider/1.webp") center center/cover no-repeat;
            filter:grayscale(100%);
            transform:scale(1.05);
        }

        /* OVERLAY SCURO */
        body::after{
            content:"";
            position:absolute;
            inset:0;
            background:rgba(0,0,0,1);
        }

        .container{
            position:relative;
            z-index:2;
            max-width:900px;
            padding:40px;
        }

        .logo{
            width:220px;
            max-width:80%;
            margin-bottom:50px;
            animation:fadeUp 1s ease forwards;
        }

        .small-title{
            letter-spacing:4px;
            text-transform:uppercase;
            font-size:13px;
            opacity:.65;
            margin-bottom:20px;
            animation:fadeUp 1s ease .2s forwards;
            opacity:0;
        }

        h1{
            font-family:'Syne',sans-serif;
            font-size:clamp(42px,7vw,90px);
            font-weight:800;
            line-height:1;
            text-transform:uppercase;
            margin-bottom:30px;
            animation:fadeUp 1s ease .4s forwards;
            opacity:0;
        }

        .description{
            max-width:650px;
            margin:auto;
            font-size:18px;
            line-height:1.8;
            opacity:.8;
            animation:fadeUp 1s ease .6s forwards;
            opacity:0;
        }

        .social{
            margin-top:50px;
            animation:fadeUp 1s ease .8s forwards;
            opacity:0;
        }

        .social a{
            color:white;
            text-decoration:none;
            letter-spacing:2px;
            text-transform:uppercase;
            font-size:13px;
            border:1px solid rgba(255,255,255,.3);
            padding:14px 28px;
            transition:.3s;
        }

        .social a:hover{
            background:white;
            color:black;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:768px){

            .description{
                font-size:16px;
            }

            .logo{
                width:170px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <img src="images/welcomehome_logo.png"
         alt="Welcome Home Festival"
         class="logo">

    <div class="small-title">
        Welcome Home Festival
    </div>

    <h1>
        L'edizione 2026<br>
        è terminata
    </h1>

    <p class="description">
        Grazie a tutti gli artisti, i visitatori, i partner e i volontari
        che hanno reso possibile questa edizione del festival.
        Ci rivedremo presto con nuovi progetti, nuove mostre e nuove storie.
    </p>

    <div class="social">
        <a href="https://www.instagram.com/welcomehomefestival/" target="_blank">
            Seguici su Instagram
        </a>
    </div>

</div>

</body>
</html>
