<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gloom - Photography Portfolio Template</title>
    <meta name="description" content="Gloom is a modern and elegant photography portfolio theme designed for creatives, photographers, and visual artists.">
    <meta name="keywords" content="photography, portfolio, gallery, fullscreen, creative, responsive, gloom">
    <meta name="author" content="DuruThemes">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/plugins.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Preloader -->
    <div class="preloader-bg"></div>
    <div id="preloader">
        <div id="preloader-status">
            <div class="preloader-position loader"> <span></span> </div>
        </div>
    </div>
    <!-- Progress scroll totop -->
    <div class="progress-wrap cursor-pointer">
        <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
            <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
        </svg>
    </div>
    <!-- Cursor -->
    <div class="cursor js-cursor"></div>
    <!-- Social Icons -->
    <div class="social-ico-block">
        <a href="https://www.instagram.com/welcomehomefestival/" target="_blank" class="social-ico"><i class="fa-brands fa-instagram"></i></a>
    </div>
    <!-- Navbar -->
    <div id="navbar-container"></div>
    <!-- Contact  -->
    <section class="contact section-padding">
        <div class="container">
            <div class="row mb-45">
                <div class="col-md-12">
                    <h6 class="wow" data-splitting>Let’s Connect and Create</h6>
                    <h1 class="wow" data-splitting>Contact</h1>
                </div>
            </div>
            <div class="row align-items-center">
                <div class="col-md-3 mb-45">
                    <div class="item">
                        <div class="wrap-block"> <span class="icon et-map-pin"></span>
                            <div class="text-block">
                                <h5>Address</h5>
                                <p>P.za Gabriele Pepe, 30, 86100 Campobasso CB</p>
                            </div>
                        </div>
                    </div>
                    <div class="item">
                        <div class="wrap-block"> <span class="icon et-notebook"></span>
                            <div class="text-block">
                                <h5>E-Mail</h5>
                                <p>info@minopasqualone.com</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-8 offset-md-1">
                    <!-- Maps -->
                    <div class="full-width">
                        <div class="google-map">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2985.4304149567593!2d14.65739847579184!3d41.559928385275505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x133a0b36eb366157%3A0xdd39daa2db524e1e!2sCircolo%20Sannitico!5e0!3m2!1sit!2sit!4v1779030453817!5m2!1sit!2sit" style="width: 100%; height: 500px; border: 0;" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Testiominals -->
    <div id="testimonials-container"></div>
    <!-- Footer -->
    <div id="footer-container"></div>
    <!-- jQuery -->
    <script src="js/plugins/jquery-3.7.1.min.js"></script>
    <script src="js/plugins/jquery-migrate-3.5.0.min.js"></script>
    <script src="js/plugins/imagesloaded.pkgd.min.js"></script>
    <script src="js/plugins/jquery.isotope.v3.0.2.js"></script>
    <script src="js/plugins/popper.min.js"></script>
    <script src="js/plugins/bootstrap.min.js"></script>
    <script src="js/plugins/owl.carousel.min.js"></script>
    <script src="js/plugins/jquery.magnific-popup.min.js"></script>
    <script src="js/plugins/YouTubePopUp.js"></script>
    <script src="js/plugins/jquery.easing.1.3.js"></script>
    <script src="js/plugins/scrollIt.min.js"></script>
    <script src="js/plugins/wow.js"></script>
    <script src="js/custom.js"></script>
    <script>
        $(document).ready(function () {
            $("#navbar-container").load("navbar.html");
            $("#footer-container").load("footer.html");
            $("#testimonials-container").load("testimonials.html", function () {
                $("[data-background]").each(function () {
                    $(this).css(
                        "background-image",
                        "url(" + $(this).attr("data-background") + ")"
                    );
                });
            });
        });
    </script>
</body>
</html>
