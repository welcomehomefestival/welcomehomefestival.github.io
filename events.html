<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Welcome Home Festival</title>

    <meta name="description"
          content="WELCOME HOME è un festival di fotografia contemporanea ideato da Mino Pasqualone.">
    <meta name="keywords" content="festival, fotografia, arte, campobasso, exhibition">
    <meta name="author" content="Welcome Home Festival">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">

    <link rel="stylesheet" href="css/plugins.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Preloader -->
<div class="preloader-bg"></div>

<div id="preloader">
    <div id="preloader-status">
        <div class="preloader-position loader">
            <span></span>
        </div>
    </div>
</div>

<!-- Progress scroll -->
<div class="progress-wrap cursor-pointer">
    <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
        <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98"/>
    </svg>
</div>

<!-- Cursor -->
<div class="cursor js-cursor"></div>

<!-- Social -->
<div class="social-ico-block">
    <a href="https://www.instagram.com/welcomehomefestival/" target="_blank" class="social-ico">
        <i class="fa-brands fa-instagram"></i>
    </a>
</div>

<!-- Navbar -->
<div id="navbar-container"></div>

<!-- EVENTS -->
<!-- EVENTS -->
<!-- EVENTS -->
<!-- EVENTS -->
<section class="events-section section-padding">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8 text-center">

                <span class="events-subtitle">
                    Program
                </span>

                <h1 class="events-title wow" data-splitting>
                    Upcoming Events
                </h1>

                <div class="no-events-box mt-5">

                    <div class="no-events-icon">
                        <i class="fa-regular fa-calendar"></i>
                    </div>

                    <h3>Programma in aggiornamento</h3>

                    <p>
                        Stiamo lavorando ai prossimi appuntamenti del
                        <strong>Welcome Home Festival</strong>.
                        Torna presto per scoprire mostre, talk, workshop
                        e incontri con gli artisti.
                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Testimonials -->
<div id="testimonials-container"></div>

<!-- Footer -->
<div id="footer-container"></div>

<!-- JS -->
<script src="js/plugins/jquery-3.7.1.min.js"></script>
<script src="js/plugins/jquery-migrate-3.5.0.min.js"></script>
<script src="js/plugins/imagesloaded.pkgd.min.js"></script>
<script src="js/plugins/jquery.isotope.v3.0.2.js"></script>
<script src="js/plugins/popper.min.js"></script>
<script src="js/plugins/bootstrap.min.js"></script>
<script src="js/plugins/owl.carousel.min.js"></script>
<script src="js/plugins/jquery.magnific-popup.min.js"></script>
<script src="js/plugins/YouTubePopUp.js"></script>
<script src="js/plugins/jquery.easing.1.3.js"></script>
<script src="js/plugins/scrollIt.min.js"></script>
<script src="js/plugins/wow.js"></script>
<script src="js/custom.js"></script>

<script>
    $(document).ready(function () {

        $("#navbar-container").load("navbar.html");

        $("#footer-container").load("footer.html");

        $("#testimonials-container").load("testimonials.html", function () {

            $("[data-background]").each(function () {

                $(this).css(
                    "background-image",
                    "url(" + $(this).attr("data-background") + ")"
                );

            });

        });

    });
</script>

</body>

</html>
