<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Home Festival</title>

    <link rel="icon" href="images/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Urbanist:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            width:100%;
            max-width:100%;
            overflow-x:hidden;
        }

        body{
            min-height:100vh;
            min-height:100dvh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:#fff;
            font-family:'Urbanist',sans-serif;
            position:relative;
            overflow-y:auto;
            background:#000;
        }

        /* Background image */
        body::before{
            content:"";
            position:fixed;
            inset:0;
            background:url("images/home-slider/1.webp") center center/cover no-repeat;
            filter:grayscale(100%);
            opacity:.15;
            z-index:0;
        }

        /* Dark overlay */
        body::after{
            content:"";
            position:fixed;
            inset:0;
            background:#000;
            z-index:1;
        }

        .container{
            position:relative;
            z-index:2;
            width:100%;
            max-width:900px;
            margin:0 auto;
            padding:60px 24px;
        }

        .logo{
            width:220px;
            max-width:80%;
            margin-bottom:50px;
            opacity:0;
            animation:fadeUp 1s ease forwards;
        }

        .small-title{
            letter-spacing:4px;
            text-transform:uppercase;
            font-size:13px;
            opacity:0;
            margin-bottom:20px;
            animation:fadeUp 1s ease .2s forwards;
        }

        h1{
            font-family:'Syne',sans-serif;
            font-size:clamp(48px,7vw,92px);
            font-weight:800;
            line-height:0.95;
            text-transform:uppercase;
            margin-bottom:30px;
            opacity:0;
            animation:fadeUp 1s ease .4s forwards;
        }

        .description{
            max-width:700px;
            margin:auto;
            font-size:20px;
            line-height:1.8;
            opacity:0;
            color:rgba(255,255,255,.85);
            animation:fadeUp 1s ease .6s forwards;
        }

        .social{
            margin-top:50px;
            opacity:0;
            animation:fadeUp 1s ease .8s forwards;
        }

        .social a{
            display:inline-block;
            color:#fff;
            text-decoration:none;
            letter-spacing:3px;
            text-transform:uppercase;
            font-size:13px;
            padding:18px 40px;
            border:1px solid rgba(255,255,255,.25);
            transition:all .3s ease;
        }

        .social a:hover{
            background:#fff;
            color:#000;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(35px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media (max-width:768px){

            .container{
                padding:40px 20px;
            }

            .logo{
                width:170px;
                margin-bottom:40px;
            }

            .small-title{
                font-size:12px;
                letter-spacing:3px;
                margin-bottom:15px;
            }

            h1{
                font-size:clamp(38px,13vw,68px);
                line-height:0.95;
                margin-bottom:25px;
            }

            .description{
                font-size:16px;
                line-height:1.7;
            }

            .social{
                margin-top:40px;
            }

            .social a{
                width:100%;
                max-width:320px;
                padding:16px 20px;
                font-size:12px;
                letter-spacing:2px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <img
            src="images/welcomehome_logo.png"
            alt="Welcome Home Festival"
            class="logo">

    <div class="small-title">
        Welcome Home Festival
    </div>

    <h1>
        L'edizione 2026<br>
        è terminata
    </h1>

    <p class="description">
        Grazie a tutti gli artisti, i visitatori, i partner e i volontari
        che hanno reso possibile questa edizione del festival.
        Ci rivedremo presto con nuovi progetti, nuove mostre e nuove storie.
    </p>

    <div class="social">
        <a href="https://www.instagram.com/welcomehomefestival/" target="_blank">
            Seguici su Instagram
        </a>
    </div>

</div>

</body>
</html>
